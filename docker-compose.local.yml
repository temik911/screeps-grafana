# Local / standalone stack — start here if you are not me.
#
# `docker-compose.yml` in this repo is wired for one specific VPS: it joins an external network that
# belongs to a different compose project (so `up` fails outright if that network doesn't exist) and
# it tells Grafana it lives at https://example.com/screeps-grafana/ behind an nginx subpath (so every
# link it emits points at a host you don't own). Neither is fixable by editing an env var, hence a
# second file rather than a flag.
#
# This one has no external anything: Grafana serves from the root of http://localhost:1337.
#
#   cp docker-compose.env.example docker-compose.env   # then fill in SCREEPS_TOKEN + RENDERER_TOKEN
#   docker compose -f docker-compose.local.yml --env-file docker-compose.env up -d
#
# See SETUP.md for the whole walkthrough, including what the bot has to write for any of this to
# show up.
volumes:
  graphite_conf:
  graphite_data:
  grafana_data:
services:
  # Polls the Screeps API for your stats segment and pushes every number in it to statsd.
  node:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    links:
      - statsd
    environment:
      GRAPHITE_PORT_8125_UDP_ADDR: "statsd"
    env_file: docker-compose.env
  # statsd receives gauges over UDP. Note UDP: if this container is down, the poller's sends vanish
  # silently — no error anywhere. "Graphs empty but the poller looks happy" starts here.
  statsd:
    image: ennexa/statsd
    restart: always
    links:
      - graphite
  graphite:
    image: ennexa/graphite
    restart: always
    volumes:
      - graphite_conf:/opt/graphite/conf
      - graphite_data:/opt/graphite/storage/whisper
  grafana:
    image: grafana/grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
    links:
      - graphite
    ports:
      - "1337:3000"
    environment:
      GF_SERVER_ROOT_URL: "http://localhost:1337/"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Panel-to-PNG rendering lives in its own container — the Grafana image ships no browser.
      # Optional: drop this service and the three GF_RENDERING_* lines if you never need images.
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_LOG_FILTERS: "rendering:info"
      # Grafana REFUSES TO START if this is left at the image's built-in default, so
      # RENDERER_TOKEN must be set in docker-compose.env before the first `up`.
      GF_RENDERING_RENDERER_TOKEN: "${RENDERER_TOKEN}"
  renderer:
    image: grafana/grafana-image-renderer:latest
    restart: always
    environment:
      ENABLE_METRICS: "false"
      AUTH_TOKEN: "${RENDERER_TOKEN}"
