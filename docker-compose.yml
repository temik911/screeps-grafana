version: "2"
networks:
  # The nginx serving https://example.com lives in a different compose project and proxies to the
  # literal host name "grafana", which it can only resolve on its own network. The previous grafana
  # container was attached to that network by hand, so the first `compose up` that recreated grafana
  # dropped the attachment and the site answered 502. Declaring it here makes the link survive a
  # recreate. After changing grafana's IP, nginx still needs a reload to re-resolve the name.
  default:
  proxy:
    external: true
    name: proxy_default
volumes:
  graphite_conf:
  graphite_data:
  grafana_data:
services:
  node:
    build:
        context: .
        dockerfile: Dockerfile
    restart: always
    links:
     - statsd
    environment:
      GRAPHITE_PORT_8125_UDP_ADDR: "statsd"
    env_file: docker-compose.env
  statsd:
    image: ennexa/statsd
    restart: always
    links:
     - graphite
  graphite:
    image: ennexa/graphite
    restart: always
    volumes:
     - graphite_conf:/opt/graphite/conf
     - graphite_data:/opt/graphite/storage/whisper
  grafana:
    image: grafana/grafana
    restart: always
    volumes:
     - grafana_data:/var/lib/grafana
    links:
     - graphite
    networks:
      default:
      proxy:
        aliases:
         - grafana
    ports:
     - "1337:3000"
    # These three used to live ONLY on the running container: any recreate silently dropped the
    # subpath and Grafana started emitting links from the domain root, breaking the dashboard behind
    # nginx. Captured here so a restart is boring.
    environment:
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "https://example.com/screeps-grafana/"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Image rendering lives in its own container (the Grafana image ships no Chromium). The callback
      # is how the renderer fetches the panel back from Grafana — it must carry the subpath, since
      # SERVE_FROM_SUB_PATH makes that the real internal path too.
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/screeps-grafana/"
      GF_LOG_FILTERS: "rendering:info"
      # Grafana refuses to boot in production mode with the image-renderer default token, so both
      # sides read the same secret from docker-compose.env (gitignored — keep it out of the yml).
      GF_RENDERING_RENDERER_TOKEN: "${RENDERER_TOKEN}"
  renderer:
    image: grafana/grafana-image-renderer:latest
    restart: always
    environment:
      ENABLE_METRICS: "false"
      AUTH_TOKEN: "${RENDERER_TOKEN}"
