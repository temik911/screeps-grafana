# Optional override: put Grafana behind a reverse proxy that lives in ANOTHER compose project.
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml --env-file docker-compose.env up -d
#
# Two things have to be true for that to work, and both were learned the hard way:
#
#  - the proxy resolves Grafana by container name, which it can only do on its own network, so
#    Grafana has to join it. Attaching the running container by hand is NOT enough — the next
#    `compose up` recreates it and silently drops the attachment, and the site starts answering 502.
#  - a proxy that serves Grafana under a path prefix needs SERVE_FROM_SUB_PATH, otherwise every link
#    Grafana emits points at the domain root. That flag also makes the prefix part of the real
#    internal path, which is why the renderer's callback URL carries it too.
#
# After Grafana's container IP changes, the proxy still has to re-read it (for nginx:
# `docker exec <proxy-container> nginx -s reload`).
#
# Set in docker-compose.env:
#   PROXY_NETWORK=name_of_the_external_docker_network
#   GRAFANA_ROOT_URL=https://example.com/grafana/
#   GRAFANA_CALLBACK_URL=http://grafana:3000/grafana/
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
services:
  grafana:
    networks:
      default:
      proxy:
        # The name the proxy config resolves. Override if your proxy expects something else.
        aliases:
          - ${PROXY_ALIAS:-grafana}
    environment:
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL}"
      GF_RENDERING_CALLBACK_URL: "${GRAFANA_CALLBACK_URL}"
