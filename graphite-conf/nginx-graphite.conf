# graphite-web served on BOTH 80 and 8000.
#
# 8000 is not decorative: the previous backend (graphite_api) listened there, and Grafana's
# datasource still points at http://graphite:8000. Serving both means the datasource needs no edit
# — which matters because changing it requires a datasources:write token that the service account
# used for automation does not have, and a container recreate without this file silently answers
# 502 on every panel.
#
# Mounted over /etc/nginx/sites-enabled/graphite-statsd.conf by docker-compose.yml.
server {
  listen 80;
  listen 8000;
  root /opt/graphite/static;
  index index.html;

  location /nginx_status {
    stub_status on;
    access_log   off;
    allow 127.0.0.1;
    deny all;
  }

  location /media {
    # django admin static files
    alias /usr/local/lib/python3.6/dist-packages/django/contrib/admin/media/;
  }

  location /admin/auth/admin {
    alias /usr/local/lib/python3.6/dist-packages/django/contrib/admin/static/admin;
  }

  location /admin/auth/user/admin {
    alias /usr/local/lib/python3.6/dist-packages/django/contrib/admin/static/admin;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header  Host      $http_host;
    proxy_set_header  X-Real-IP $remote_addr;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
    add_header 'Access-Control-Allow-Credentials' 'true';
  }

}
